    <g id="blade">
      <path d="M-4.2-24.2 4.2-24.2 1.6-12.4-1.6-12.4Z" fill="#47C4D1"/>
      <path d="M-4.2-24.2-1.6-12.4 0-24.2Z" fill="#2A9AA6"/>
      <path d="M4.2-24.2 1.6-12.4 0-24.2Z" fill="#8FDEE6"/>
    </g>
    <use href="#blade" transform="rotate(45)"/>
